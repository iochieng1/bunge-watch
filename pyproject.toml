[project]
name = "bunge-watch"
version = "0.1.0"
description = "Track Kenyan bills and explain them in plain English and Kiswahili"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rag-local = ["sentence-transformers>=3.0"]
rag-voyage = ["voyageai>=0.3"]

[project.scripts]
bunge-watch = "bunge_watch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bunge_watch", "bunge_watch.rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
